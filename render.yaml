# yaml-language-server: $schema=

databases:
  - name: sportmanager-db
    databaseName: sportmanager
    plan: starter

services:
  # ── Redis (za Bull queues) ────────────────────────────────────────────────────
  - type: redis
    name: sportmanager-redis
    plan: starter
    ipAllowList: []

  # ── Backend ───────────────────────────────────────────────────────────────────
  - type: web
    name: sportmanager-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sportmanager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sportmanager-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # ── Frontend (Static Site) ────────────────────────────────────────────────────
  - type: web
    name: sportmanager-frontend
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── AI Service ────────────────────────────────────────────────────────────────
  - type: web
    name: sportmanager-ai
    runtime: python
    plan: starter
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportmanager-db
          property: connectionString